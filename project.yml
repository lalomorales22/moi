name: MOI
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MOI:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  MOI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MOI
        product: MOICore
    # Bundle ID and team live in Config/MOI.xcconfig, which optionally includes the
    # git-ignored Config/Signing.local.xcconfig. ./start.sh overrides both on the
    # xcodebuild command line, so existing com.moi.phone installs still update in place.
    configFiles:
      Debug: Config/MOI.xcconfig
      Release: Config/MOI.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MOI:
    build:
      targets:
        MOI: all
    run:
      config: Debug
    archive:
      config: Release
